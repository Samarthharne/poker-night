[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Next inlines server env into function bundles; omit those keys from secret scan.
  SECRETS_SCAN_OMIT_KEYS = "METERED_API_KEY,METERED_DOMAIN,TURN_USERNAME,TURN_CREDENTIAL,TURN_SECRET,TURN_URLS,ADMIN_SESSION_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD"
  SECRETS_SCAN_OMIT_PATHS = ".next,.netlify"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Invitation links only work if Visitor access is Public.
# Netlify UI: Project configuration → General → Visitor access → Public.
